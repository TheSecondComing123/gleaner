name: ci
# billed minutes: code changes only, no macOS
on:
  push:
    branches: [main]
    paths: [src/**, test/**, scripts/**, package.json, pnpm-lock.yaml, tsconfig.json, biome.json, .github/workflows/**]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm lint && pnpm typecheck
      - run: pnpm test
      # bash on ubuntu, pwsh on windows
      - run: npm install -g typescript
      - name: download vs code
        shell: bash
        run: node -e "require('@vscode/test-electron').downloadAndUnzipVSCode('stable').then((p) => require('fs').appendFileSync(process.env.GITHUB_ENV, 'VSCODE_BIN=' + p + '\n'))"
      - name: e2e
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: |
            docs/screenshot.png
            e2e-failure.png
